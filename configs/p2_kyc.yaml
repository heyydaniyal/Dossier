# Phase 2 tasks 6-7: synthetic KYC. DECLARED BEFORE any KYC attribute is measured on data
# (commit before the first HI-Medium run). Everything here is synthetic unless marked REAL.
version: 1
seed: 20260930
kyc_as_of: "2022-09-02T00:00:00+00:00"   # profiles are what the bank knew before the first window

# ---------------------------------------------------------------- base attributes (no labels)
# REAL: entity_type (accounts file), bank_location / bank_country (parsed from bank name).
# DATA-DERIVED: expected_activity_band from BURN-IN day activity (2022-09-01 < every as_of).
# SYNTHETIC: sector_or_occupation, onboarding_year, country_risk tiers, customer_risk_rating.

activity_band:
  bands: [low, medium, high, very_high]
  # percentile of burn-in USD volume WITHIN the account's entity type -> band
  cuts: [0.50, 0.90, 0.99]
  noise_prob: 0.25          # declared activity is imprecise: shift one band up or down
  prior_if_inactive: {low: 0.50, medium: 0.35, high: 0.12, very_high: 0.03}

onboarding:
  start: "2005-01-01"
  end: "2022-08-31"         # uniform over days; before the data span
  stored_as: year           # KYC v2: a day-level date acted as an account fingerprint (it let a
                            # model memorise TRAIN laundering accounts); only the year is stored

sectors:                    # business entity types; weight, risk tier
  professional_services: {w: 14, risk: low}
  manufacturing: {w: 10, risk: low}
  retail_non_cash: {w: 10, risk: low}
  it_services: {w: 8, risk: low}
  healthcare: {w: 6, risk: low}
  construction_contractor: {w: 7, risk: medium}
  logistics: {w: 6, risk: low}
  agriculture: {w: 4, risk: low}
  wholesale_trade: {w: 8, risk: medium}
  import_export_trading: {w: 5, risk: medium}
  real_estate_agency: {w: 5, risk: medium}
  hospitality_hotel: {w: 4, risk: medium}
  payroll_service: {w: 2, risk: medium}
  ecommerce_marketplace: {w: 3, risk: medium}
  charity_non_profit: {w: 2, risk: medium}
  escrow_title_company: {w: 1, risk: medium}
  restaurant: {w: 3, risk: high}
  convenience_store: {w: 2, risk: high}
  car_wash: {w: 1, risk: high}
  money_services_business: {w: 1, risk: high}
  payment_processor: {w: 1, risk: high}
  precious_metals_dealer: {w: 1, risk: high}
  crypto_exchange: {w: 1, risk: high}
  foreign_exchange_bureau: {w: 1, risk: high}
occupations:                # entity type Individual
  salaried_employee: {w: 50, risk: low}
  civil_servant: {w: 10, risk: low}
  retiree: {w: 12, risk: low}
  student: {w: 6, risk: low}
  self_employed_trader: {w: 12, risk: medium}
  property_investor: {w: 6, risk: medium}
  business_owner_cash_intensive: {w: 4, risk: high}
public_sector_types: [Country]            # -> government_public_body, risk low
individual_types: [Individual]

country_risk:
  domestic: United States                 # named banks (no '#n'), see bank-name formats below
  domestic_tier: low
  crypto: Crypto                          # '<Crytpo> Bank #n' platforms: no jurisdiction
  crypto_tier: high                       # decided by Dani 2026-09-30: fixed high (regulators rank crypto platforms high-risk)
  foreign_tier_probs: {low: 0.60, medium: 0.30, high: 0.10}   # synthetic, per country, seeded

customer_risk_rating:       # points: sector/occupation risk (0/1/2) + country risk (0/1/2)
  very_high_activity_point: 1           #  + 1 if expected band is very_high
  noise_prob: 0.10                      #  then +/-1 with this probability
  cuts: {medium_at: 2, high_at: 3}      # <2 low, 2 medium, >=3 high

# ---------------------------------------------------------------- task 7: planted explanations
# KYC v2 (approved by Dani 2026-09-30). v1 planted profiles on alerted accounts using their labels
# (label-balanced 30%/30%). The TRAIN/VALIDATION diagnostic (docs/p2/p2_kyc_diagnostics.json) showed
# that v1 leaked FUTURE information: among accounts with no TRAIN alert, an explanation-type sector
# made a VALIDATION alert 1.9x more likely (planting used later alerts). v2 is LABEL-FREE and uses
# only the burn-in day (2022-09-01, before every window): an account whose burn-in behaviour is
# extreme for some rule statistic may receive a profile that explains that behaviour. If the
# behaviour recurs later, the profile explains the later alert, for launderers and legitimate
# customers alike. No firewall exception is needed any more.
# Parameters declared BEFORE measuring v2. Realised rates among alerted accounts (real vs false,
# pre-TEST periods only) are measured and reported, as task 7 requires.
planting:
  method: burn_in_behaviour
  # v2.1 (approved by Dani 2026-09-30, declared before the rerun). v2 used top 1% and 0.5: realised
  # explaining-profile rate among pre-TEST alerted accounts was only 7.4% (legitimate) / 3.4%
  # (laundering), too little material for the Defence agent. Rates are measured again, not promised.
  candidate_percentile: 0.95      # dominant burn-in behaviour in the top 5% of active accounts
  planting_prob: 1.0              # every candidate receives an explaining profile
  planted_band_probs: {high: 0.6, very_high: 0.4}
  individual_occupation: business_owner_cash_intensive
  behaviour_stats:                # behaviour -> the rule statistic that measures it (p2_rules.yaml)
    R01_LARGE_SINGLE_TXN: max_txn_usd
    R02_PEER_VOLUME_OUTLIER: volume_usd
    R03_STRUCTURING: n_near_threshold
    R04_FAN_IN: n_distinct_senders
    R05_FAN_OUT: n_distinct_receivers
    R06_RAPID_IN_OUT: pass_through_usd
    R07_HIGH_RISK_CHANNEL: high_risk_channel_usd
    R08_CROSS_CURRENCY_CHURN: n_cross_currency
    R09_ROUND_AMOUNTS: n_round_amounts
  archetypes:               # behaviour -> sectors whose normal business looks like it
    R01_LARGE_SINGLE_TXN: [real_estate_agency, wholesale_trade, precious_metals_dealer]
    R02_PEER_VOLUME_OUTLIER: [wholesale_trade, payment_processor, logistics]
    R03_STRUCTURING: [convenience_store, restaurant]
    R04_FAN_IN: [payment_processor, ecommerce_marketplace, charity_non_profit]
    R05_FAN_OUT: [payroll_service, wholesale_trade]
    R06_RAPID_IN_OUT: [escrow_title_company, payment_processor, money_services_business]
    R07_HIGH_RISK_CHANNEL: [restaurant, car_wash, convenience_store, crypto_exchange]
    R08_CROSS_CURRENCY_CHURN: [import_export_trading, foreign_exchange_bureau]
    R09_ROUND_AMOUNTS: [real_estate_agency, construction_contractor]

# ---------------------------------------------------------------- task 6: leakage ceilings
# Declared BEFORE measurement. Alert level: fit on TRAIN alerts, evaluate on VALIDATION alerts,
# target = is_true_positive, PR-AUC = average precision, prev = VALIDATION alert prevalence.
# Reasoning: synthetic attributes are generated without labels (v2: also planting), so their
# expected lift is 1.0. (Ceilings unchanged by KYC v2.) The REAL attributes measured in P1 (entity type) have lift
# 0.6-1.5. A KYC-only model above 2x the base rate would mean a clue, not context.
ceilings:
  kyc_only_pr_auc_max_multiple_of_prev: 2.0              # C1: all KYC attributes
  synthetic_increment_max_multiple_of_prev: 0.25         # C2: PR-AUC(all KYC) - PR-AUC(real+data-derived KYC)
  txn_plus_kyc_increment_max_multiple_of_prev: 0.50      # C3: PR-AUC(txn+KYC) - PR-AUC(txn only)
  txn_synthetic_increment_max_multiple_of_prev: 0.25     # C4: PR-AUC(txn+KYC) - PR-AUC(txn+real KYC)
  model: "HistGradientBoostingClassifier(max_iter=200, learning_rate=0.1, max_leaf_nodes=31, early_stopping=False, random_state=0)"
  bootstrap_reps: 200       # paired bootstrap on VALIDATION, reported only (the gate is the point estimate)

# ---- Outcome of C1/C2 and the guard that replaces them downstream (Dani, 2026-09-30) ------------
# KYC v2 run (2026-09-30): C1 = 2.63x prev and C2 = 1.16x prev FAILED; C3 and C4 passed.
# KYC v2.1 run (final, 2026-09-30): C1 = 2.04x and C2 = 0.49x FAILED; C3 = -0.65x, C4 = -0.14x
# passed (KYC LOWERS PR-AUC when added to transaction features).
# The same test on VALIDATION accounts never alerted in TRAIN gave C1 = 1.01x (v2) / 0.96x (v2.1),
# i.e. no signal, and all checks passing. Meaning: KYC carries no planted clue; the failure is ACCOUNT RECOGNITION (stable
# per-account field combinations identify accounts that recur between TRAIN and VALIDATION).
# Ceilings are unchanged and the failure stays recorded (accepted_ceiling_failures, final values
# filled in from the final run). The real risk is in models, so it is blocked there:
identity_guard:
  rule: >-
    Binding for P3-P5: every model feature group is evaluated on VALIDATION separately for accounts
    seen in TRAIN and accounts not seen in TRAIN (src/eval/identity_guard.py). A feature group whose
    incremental PR-AUC appears only on seen accounts is account recognition and is removed or
    fixed. Model results are always reported for regime B (unseen accounts) next to regime A.
    Agents are unaffected: they do not learn across cases.
  # Verdict thresholds (declared 2026-09-30, BEFORE the guard is applied to anything). Gains are
  # AP(base + group) - AP(base), each divided by its own subset's prevalence. P3 may tighten these,
  # never loosen them without Dani's decision.
  thresholds:
    min_positives: 20                  # per subset (seen / unseen); fewer -> group not cleared
    materiality_gain_over_prev: 0.05   # below this on seen accounts the group adds nothing
    min_unseen_to_seen_ratio: 0.5      # unseen gain must be at least half the seen gain
  # Applied here to KYC as a feature group on top of the transaction features (same design as C3).
  # If KYC gets 'account_recognition', P3 must not use KYC fields as model features (agents may
  # still read KYC as case context).
  required_unseen_check_pass: true   # the P2 KYC test on unseen accounts must pass (all checks)
# Values copied exactly from docs/p2/p2_results.json (build.kyc.leakage.checks) of the v2.1 run
# (config sha256 b371a499..., finished 2026-09-30T11:32:29Z). A results test requires an exact match.
accepted_ceiling_failures:
  - check: C1_kyc_only
    measured_value: 0.1043833716     # 2.04 x prev; ceiling 0.1024531025 (2.0 x prev)
    decided_by: Dani
    decided_on: "2026-09-30"
    reason: &guard_reason >-
      Account recognition, not a planted clue: on VALIDATION accounts never alerted in TRAIN every
      check passes (C1 = 0.96 x prev). The identity guard gives KYC 'account_recognition' (seen gain
      +0.86 x prev, unseen gain -0.38 x prev), so KYC fields are excluded from P3-P5 model
      features. Agents may read KYC as case context.
  - check: C2_synthetic_increment
    measured_value: 0.02508205783    # 0.49 x prev; ceiling 0.01280663781 (0.25 x prev)
    decided_by: Dani
    decided_on: "2026-09-30"
    reason: *guard_reason

attribute_groups:                # categorical unless listed under numeric
  real_or_data_derived: [entity_type, bank_country, country_risk, expected_activity_band]
  synthetic: [sector_or_occupation, onboarding_year, customer_risk_rating]
  numeric: [onboarding_year]

# Bank-name formats, as printed by scripts/p2/discover_banks.py on HI-Medium (2026-09-30):
#   '<X> Bank #<n>' (1,312,489 accounts): X is one of the 32 countries below, or 'Crytpo'
#   (the data's own spelling; crypto platforms). Any other name (775,297 accounts, 468 names such
#   as 'Savings Bank of Seattle', 'Hearthstone Bancorp') is a US-style named bank -> United States.
# An '<X> Bank #<n>' prefix not listed here stops the run (unexpected format, never guessed).
foreign_countries: [Australia, Austria, Belgium, Brazil, Canada, China, Croatia, Cyprus, Estonia,
  Finland, France, Germany, Greece, India, Ireland, Israel, Italy, Japan, Latvia, Lithuania,
  Luxembourg, Malta, Mexico, Netherlands, Portugal, Russia, Saudi Arabia, Slovakia, Slovenia, Spain,
  Switzerland, UK]
crypto_prefixes: [Crytpo]
